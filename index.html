<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consensus Weather</title>
  <style>
    :root { color-scheme: light dark; --ink: #0f1419; --muted: #5a6570; --bg: #0b0e12; --card: #151a22; --link: #5b9dff; --teal: #2ee6ff; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1a2740, var(--bg)); color: var(--ink); color: #e8eef5; }
    main { max-width: 640px; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { font-size: 2rem; margin: 0 0 .4rem; }
    .tag { color: var(--teal); font-weight: 600; margin-bottom: 1rem; }
    p { color: #9aa8b5; line-height: 1.55; }
    a.btn { display: inline-block; margin: .4rem .6rem .4rem 0; padding: .65rem 1rem; border-radius: 12px; background: #1e2a3d; color: #e8eef5; text-decoration: none; font-weight: 600; }
    a.btn.primary { background: linear-gradient(135deg, #2ee6ff33, #3b7cff55); border: 1px solid #2ee6ff66; }
  </style>
</head>
<body>
  <main>
    <h1>Consensus Weather</h1>
    <p class="tag">Multi-model intelligence, refined over time.</p>
    <p>Four forecast models enter the lens. One consensus beam emerges — weighted for your location as real temperatures arrive.</p>
    <p>
      <a class="btn primary" href="privacy/">Privacy policy</a>
      <a class="btn" href="support/">Support</a>
    </p>
  </main>
</body>
</html>
